name: CI

on:
  push:
    branches: [main]
  pull_request:

# A CI só lê o repositório. Nenhum segredo é usado: o cadastro roda sem chave de IA.
permissions:
  contents: read

# Uma execução nova na mesma branch cancela a anterior que ainda estiver rodando.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes e empacotamento)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Os testes de integração sobem um PostgreSQL 16 pelo Testcontainers, que usa o Docker do runner.
      - name: ./mvnw verify
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (lint, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Testes
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Navegador (jornada e borda, contra o Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Mesmo caminho do README (cp .env.example .env). Os tetos sobem só para o teste não esbarrar
      # neles, e o de origem fica em 100 para a checagem do X-Forwarded-For ser rápida.
      - name: Preparar o ambiente
        run: |
          cp .env.example .env
          sed -i 's/^LIMITE_RESPOSTAS_POR_MINUTO=.*/LIMITE_RESPOSTAS_POR_MINUTO=100/' .env
          sed -i 's/^LIMITE_REQUISICOES_POR_ORIGEM_POR_MINUTO=.*/LIMITE_REQUISICOES_POR_ORIGEM_POR_MINUTO=100/' .env

      - name: Subir o Compose (banco, API e nginx)
        run: docker compose up --build -d --wait --wait-timeout 600

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar o Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Rodar os testes de navegador
        working-directory: e2e
        env:
          E2E_LIMITE_ORIGEM: '100'
        run: npx playwright test

      - name: Logs do Compose (só se falhou)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Relatório do Playwright (só se falhou)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Derrubar o Compose
        if: always()
        run: docker compose down -v
