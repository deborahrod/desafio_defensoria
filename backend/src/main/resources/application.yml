spring:
  application:
    name: cadastro
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cadastro}
    username: ${DB_USER:cadastro}
    password: ${DB_PASSWORD:cadastro_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

cadastro:
  sessao:
    expiracao: ${SESSAO_EXPIRACAO_MINUTOS:30}m
    cookie-seguro: ${SESSAO_COOKIE_SEGURO:false}
    intervalo-limpeza: 5m
    retencao-encerradas: 24h
  cors:
    origens: ${CORS_ORIGENS:}
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.mistral.ai/v1}
    model: ${LLM_MODEL:mistral-small-latest}
    timeout: ${LLM_TIMEOUT_SECONDS:15}s
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:350}

server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
