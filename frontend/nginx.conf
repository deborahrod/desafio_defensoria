server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança. Ficam no nível do servidor: um add_header dentro de um location
    # faria o nginx descartar todos estes. A página só carrega recursos da própria origem (as fontes
    # Roboto vêm empacotadas) e o Material UI injeta estilos, por isso style-src aceita 'unsafe-inline'.
    # Em HTTPS, acrescente Strict-Transport-Security no ponto que termina o TLS.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $http_host;
        # Só este proxy fala com a API: o endereço é o da conexão, e o que o cliente
        # mandar em X-Forwarded-For é descartado em vez de anexado.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A API também envia estes dois. O nginx fica com a cópia dele, para não duplicar.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    location / {
        try_files $uri /index.html;
    }
}
