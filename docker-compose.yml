name: desafio-defensoria

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cadastro}
      POSTGRES_USER: ${DB_USER:-cadastro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cadastro_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cadastro}
      DB_USER: ${DB_USER:-cadastro}
      DB_PASSWORD: ${DB_PASSWORD:-cadastro_local}
      SESSAO_EXPIRACAO_MINUTOS: ${SESSAO_EXPIRACAO_MINUTOS:-30}
      SESSAO_COOKIE_SEGURO: ${SESSAO_COOKIE_SEGURO:-false}
      CORS_ORIGENS: ${CORS_ORIGENS:-}
      LIMITE_RESPOSTAS_POR_SESSAO: ${LIMITE_RESPOSTAS_POR_SESSAO:-60}
      LIMITE_RESPOSTAS_POR_MINUTO: ${LIMITE_RESPOSTAS_POR_MINUTO:-10}
      LIMITE_REQUISICOES_POR_ORIGEM_POR_MINUTO: ${LIMITE_REQUISICOES_POR_ORIGEM_POR_MINUTO:-120}
      # O nginx do serviço web é o proxy confiável: o endereço de origem vem do X-Forwarded-For dele.
      LIMITES_CONFIAR_EM_PROXY: "true"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.mistral.ai/v1}
      LLM_MODEL: ${LLM_MODEL:-mistral-small-latest}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-350}
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    mem_limit: 768m

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m

volumes:
  pgdata:
