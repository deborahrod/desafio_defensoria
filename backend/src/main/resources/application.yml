spring:
  application:
    name: cadastro
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cadastro}
    username: ${DB_USER:cadastro}
    password: ${DB_PASSWORD:cadastro_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

cadastro:
  sessao:
    expiracao: ${SESSAO_EXPIRACAO_MINUTOS:30}m
    cookie-seguro: ${SESSAO_COOKIE_SEGURO:false}
    intervalo-limpeza: 5m
    retencao-encerradas: 24h
  cors:
    origens: ${CORS_ORIGENS:}
  limites:
    respostas-por-sessao: ${LIMITE_RESPOSTAS_POR_SESSAO:60}
    respostas-por-minuto: ${LIMITE_RESPOSTAS_POR_MINUTO:10}
    requisicoes-por-origem-por-minuto: ${LIMITE_REQUISICOES_POR_ORIGEM_POR_MINUTO:120}
    confiar-em-proxy: ${LIMITES_CONFIAR_EM_PROXY:false}
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.mistral.ai/v1}
    model: ${LLM_MODEL:mistral-small-latest}
    timeout: ${LLM_TIMEOUT_SECONDS:15}s
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:350}

  cep:
    timeout: ${CEP_TIMEOUT_MS:3000}ms
    viacep-url: ${CEP_VIACEP_URL:https://viacep.com.br/ws}
    brasilapi-url: ${CEP_BRASILAPI_URL:https://brasilapi.com.br/api/cep/v2}
    cache-maximo: ${CEP_CACHE_MAXIMO:500}
    cache-validade: ${CEP_CACHE_VALIDADE_HORAS:6}h

server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
